name: Deploy to Cloud Run

on:
  workflow_dispatch: # Manual trigger only — run from GitHub Actions UI to deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          FRONTEND_URL: "https://coderr.simon-kiesner.de"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: coderr-sk-2026
          region: europe-west1
          source: .
          env_vars: |
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=coderr-sk-2026-633433832477.europe-west1.run.app
            FRONTEND_URL=https://coderr.simon-kiesner.de
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
